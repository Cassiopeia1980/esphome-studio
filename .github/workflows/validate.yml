name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      - run: pytest -q
  panel:
    name: panel (jsdom, de + en)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml voluptuous
      - run: mkdir -p /tmp/jsdom-test && cd /tmp/jsdom-test && npm init -y >/dev/null && npm install jsdom@29.1.1
      - run: node tests/ui_smoke.mjs
      - run: node tests/ui_smoke_en.mjs
  esphome-config:
    name: esphome config (de + en)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install esphome pyyaml voluptuous
      - run: python tests/validate_with_esphome.py "$(which esphome)"
      - run: python tests/validate_with_esphome.py "$(which esphome)" --lang=en
