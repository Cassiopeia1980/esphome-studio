substitutions:
  name: terrasse
  friendly: Terrasse
  relay_pin: GPIO4

esphome:
  name: ${name}
  friendly_name: ${friendly}
  on_boot:
    priority: -100
    then:
      - logger.log: "Hallo"
      - lambda: |-
          ESP_LOGI("boot", "bereit");

esp8266:
  board: d1_mini
  restore_from_flash: true

logger:
  level: DEBUG
  baud_rate: 0

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 30min

ota:
  - platform: esphome
    password: !secret ota_pw

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "Terrasse Fallback"
    password: !secret ap_pw

captive_portal:

globals:
  - id: zaehler
    type: int
    restore_value: no
    initial_value: "0"

script:
  - id: blinken
    then:
      - switch.turn_on: pumpe
      - delay: 1s
      - switch.turn_off: pumpe

interval:
  - interval: 60s
    then:
      - lambda: |-
          id(zaehler) += 1;

switch:
  - platform: gpio
    name: "Pumpe"
    id: pumpe
    pin: ${relay_pin}
    icon: mdi:water-pump
  - platform: gpio
    name: "Licht Relais"
    id: licht_relais
    pin:
      number: GPIO5
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: template
    name: "Virtuell"
    optimistic: true

binary_sensor:
  - platform: gpio
    name: "Taster"
    pin:
      number: D5
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      - switch.toggle: licht_relais
  - platform: gpio
    name: "Tür"
    pin:
      number: D3
      mode: INPUT_PULLUP
    on_press:
      then:
        - script.execute: blinken

sensor:
  - platform: dallas_temp
    name: "Teich"
    address: 0x1c0000031edd2a28
    one_wire_id: bus1
  - platform: dallas_temp
    name: "Beet"
    address: 0x2c0000031edd2a29
    one_wire_id: bus1
  - platform: template
    name: "Zähler"
    lambda: return id(zaehler);
  - platform: wifi_signal
    name: "WLAN"
    update_interval: 120s

one_wire:
  - platform: gpio
    pin: GPIO13
    id: bus1

light:
  - platform: monochromatic
    name: "Lampe"
    output: lampe_out
    gamma_correct: 2.2

output:
  - platform: esp8266_pwm
    id: lampe_out
    pin: GPIO12
