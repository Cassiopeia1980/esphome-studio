substitutions:
  devicename: "acepro1"
  device_description: "Beleuchtung von Anycubic ACE Pro 1"

esphome:
  name: $devicename
  friendly_name: "ACE Pro 1"
  comment: ${device_description}
  on_boot:
    priority: -100
    then:
      - delay: 300ms
      - if:
          condition:
            binary_sensor.is_on: reed
          then:
            - light.turn_off: lampe
          else:
            - light.turn_on: lampe

esp8266:
  board: d1_mini
  board_flash_mode: dout
  early_pin_init: false

logger:
  level: INFO

api:

debug:

ota:
  - platform: esphome
    password: !secret ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  manual_ip:
    static_ip: 192.168.3.78
    gateway: 192.168.1.1
    subnet: 255.255.252.0
    dns1: 192.168.1.1

  ap:
    ssid: "${devicename} Fallback AP"
    password: !secret ap_password

captive_portal:

button:
  - platform: restart
    name: "Reboot"

binary_sensor:
  - platform: gpio
    id: reed
    pin:
      number: GPIO13
      mode: INPUT_PULLUP
      inverted: true
    name: "Reed-Sensor"
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - light.turn_off: lampe
    on_release:
      - light.turn_on: lampe
  - platform: status
    name: "Status"

light:
  - platform: monochromatic
    name: "Lampe"
    id: lampe
    output: output_component1
    restore_mode: RESTORE_DEFAULT_OFF

output:
  - platform: esp8266_pwm
    id: output_component1
    pin: GPIO5

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      icon: mdi:ip-network
    ssid:
      name: "Connected SSID"
      icon: mdi:access-point-network
    bssid:
      name: "Connected BSSID"
      icon: mdi:access-point
    mac_address:
      name: "Mac Wifi Address"
      icon: mdi:ip
  - platform: uptime
    name: "Betriebszeit"
    icon: mdi:clock-start
    update_interval: 60s
    format:
      separator: " "
      days: "T"
      hours: "Std"
      minutes: "Min"
      seconds: "Sek"
  - platform: debug
    reset_reason:
      name: Reset Reason
